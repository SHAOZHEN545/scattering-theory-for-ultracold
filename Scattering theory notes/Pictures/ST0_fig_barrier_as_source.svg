<?xml version="1.0" encoding="UTF-8"?>
<!--
  Scattering Theory 0, §5.2: the barrier as a source that radiates only while the packet is on it.
  Coordinates: the spacetime origin (x = 0, t = 0) is at (340, 230); t increases upward.
  The incident line x = v0 t and the emission rays x = ±v0 (t - t') all have slope 240 px in x per 170 px in t.
  Emission rays start at t' = -t_c, 0, +t_c, i.e. at y = 255, 230, 205.
  Colors and line styles are set in <style>; change them there.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <style>
    .bg       { fill: #ffffff; }
    .label    { font-family: "STIX Two Text", "Times New Roman", serif; font-size: 16px; fill: #222222; }
    .small    { font-family: "STIX Two Text", "Times New Roman", serif; font-size: 14px; fill: #555555; }
    .axis     { stroke: #222222; stroke-width: 1.5; fill: none; }
    .barrier  { stroke: #888780; stroke-width: 2; }
    .source   { stroke: #D85A30; stroke-width: 7; }
    .incident { stroke: #D85A30; stroke-width: 3; fill: none; }
    .free     { stroke: #888780; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    .emitted  { stroke: #1D9E75; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="440"/>

  <g id="axes">
    <line class="axis" x1="40" y1="405" x2="40" y2="45" marker-end="url(#arrow)"/>
    <text class="label" x="40" y="34" text-anchor="middle" font-style="italic">t</text>
    <text class="small" x="48" y="234">0</text>
    <line class="axis" x1="60" y1="410" x2="630" y2="410" marker-end="url(#arrow)"/>
    <text class="label" x="640" y="414" font-style="italic">x</text>
  </g>

  <g id="barrier">
    <line class="barrier" x1="340" y1="45" x2="340" y2="405"/>
    <text class="label" x="340" y="30" text-anchor="middle">barrier, <tspan font-style="italic">x</tspan> = 0</text>
  </g>

  <g id="free-continuation">
    <line class="free" x1="340" y1="230" x2="580" y2="60"/>
  </g>

  <g id="emitted-waves">
    <line class="emitted" x1="340" y1="255" x2="600" y2="71" marker-end="url(#arrow)"/>
    <line class="emitted" x1="340" y1="255" x2="80"  y2="71" marker-end="url(#arrow)"/>
    <line class="emitted" x1="340" y1="230" x2="594" y2="50" marker-end="url(#arrow)"/>
    <line class="emitted" x1="340" y1="230" x2="86"  y2="50" marker-end="url(#arrow)"/>
    <line class="emitted" x1="340" y1="205" x2="559" y2="50" marker-end="url(#arrow)"/>
    <line class="emitted" x1="340" y1="205" x2="121" y2="50" marker-end="url(#arrow)"/>
  </g>

  <g id="incident-packet">
    <line class="incident" x1="100" y1="400" x2="334" y2="234" marker-end="url(#arrow)"/>
    <text class="label" x="160" y="392">incident packet</text>
  </g>

  <g id="source-pulse">
    <line class="source" x1="340" y1="205" x2="340" y2="255"/>
    <text class="small" x="356" y="268">source ∝ <tspan font-style="italic">ψ</tspan>(0, <tspan font-style="italic">t′</tspan>): on only</text>
    <text class="small" x="356" y="284">while the packet is here</text>
  </g>

  <g id="annotations">
    <text class="small" x="356" y="350"><tspan font-style="italic">t</tspan> ≪ −<tspan font-style="italic">t</tspan><tspan baseline-shift="sub" font-size="10">c</tspan>: nothing at the barrier yet,</text>
    <text class="small" x="356" y="366">so nothing has been radiated</text>
    <text class="small" x="180" y="178" text-anchor="end">scattered → reflected</text>
    <text class="small" x="452" y="196">scattered + <tspan font-style="italic">ψ</tspan><tspan baseline-shift="sub" font-size="10">0</tspan> → transmitted</text>
  </g>
</svg>
